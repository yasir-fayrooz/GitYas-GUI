[package]
name = "gityas-frontend"
description = "A native Git client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "gityas"
path = "src/main.rs"

# `cargo packager --release -p gityas-frontend -f <format>` (formats per OS: nsis | app,dmg | deb,appimage) for local
# packages. Releases use it for the Windows installer only and build the macOS / Linux packages themselves
# (scripts/release/, docs/releasing.md). The updater installs nsis (per-user, no admin prompt), app and appimage
# bundles. Windows code-signing settings are added by scripts/release/package-windows.sh. No URL scheme or file associations.
[package.metadata.packager]
product-name = "GitYas"
identifier = "com.gityas.GitYas"
publisher = "Yasir Fayrooz"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p gityas-frontend"
# Used by the macOS (.icns) and Linux bundles only; the Windows exe embeds assets/icon.ico itself (build.rs).
icons = ["assets/32x32.png", "assets/128x128.png", "assets/128x128@2x.png", "assets/icon.png"]

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"

[package.metadata.packager.deb]
# The folder picker uses the XDG desktop portal (libdbus, for keyring's Secret Service backend, is linked statically).
depends = ["xdg-desktop-portal"]

