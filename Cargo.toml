[workspace]
resolver = "3"
members = ["src-frontend", "src-backend/gityas-*"]

[workspace.package]
version = "1.0.1"
edition = "2024"
authors = ["Yasir Fayrooz"]
license = "MIT"
repository = "https://github.com/yasir-fayrooz/GitYas-GUI"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Internal crates. Dependency rule: core <- git, storage, auth, platform <- engine <- frontend.
gityas-core = { path = "src-backend/gityas-core" }
gityas-git = { path = "src-backend/gityas-git" }
gityas-storage = { path = "src-backend/gityas-storage" }
gityas-auth = { path = "src-backend/gityas-auth" }
gityas-platform = { path = "src-backend/gityas-platform" }
gityas-engine = { path = "src-backend/gityas-engine" }

# Runtime / async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"

# Data
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
secrecy = "0.10"
zeroize = "1"
nanoid = "0.4"

# Git
# `vendored-openssl`: libssh2 (git2 `ssh`) needs OpenSSL on macOS/Linux. Building it from source links it statically, so
# the macOS app does not depend on a Homebrew dylib, and cross-compiling from Windows works (needs perl + make:
# docs/releasing.md).
git2 = { version = "0.20", features = ["vendored-openssl"] }

# Storage
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"

# Auth. keyring 3.6: `sync-secret-service` alone makes the persistent Secret Service store (GNOME Keyring /
# KWallet over D-Bus) the default on Linux/FreeBSD/OpenBSD; `linux-native` alone would be session-scoped keyutils.
# `vendored` builds libdbus from source and links it statically, so the Linux build needs no libdbus-1-dev or
# pkg-config and cross-compiles from Windows with cargo-zigbuild (docs/releasing.md). TODO: add
# `crypto-rust` (encrypts the secret on the session bus) once the lockfile can be updated online.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }

# Reading OpenSSH private keys (gityas-git: is a key passphrase-protected?).
base64 = "0.22"

# Platform
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
open = "5"
notify-debouncer-mini = "0.6"

# Frontend
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
egui-phosphor = "0.14"
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }
# Linux uses the XDG desktop portal (no GTK build dependency). `async-std`, not `tokio`: the folder picker is a
# blocking call on the UI thread, which has no tokio runtime entered. macOS/Windows ignore both features.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Self-update: cargo-packager's updater reads a static JSON manifest and verifies each bundle's minisign signature
# before installing it (docs/releasing.md).
cargo-packager-updater = "0.2"
semver = "1"
# Dragging files out of the window into other apps (Windows / macOS; its Linux backend needs GTK, which winit
# does not use, so Linux has no drag-out).
drag = "2"
# System-wide shortcut that opens speed mode from other apps (Windows RegisterHotKey, macOS Carbon, Linux X11;
# Wayland has no global shortcuts, so it does nothing there).
global-hotkey = "0.9"
# Speed mode hands the focus back to the app it was summoned from: the foreground window on Windows (safe Win32
# wrappers), the frontmost app on macOS (AppKit, already in the tree through eframe / winit).
winsafe = { version = "0.0.29", features = ["user"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSScreen", "NSWorkspace"] }
# CHANGELOG.md, compiled in and rendered in the What's new dialog.
pulldown-cmark = { version = "0.13", default-features = false }

# Syntax highlighting (diff viewer, merge editor): tree-sitter grammars + their highlight queries, with
# bat's Sublime syntaxes (two-face / syntect, pure-Rust regex) as the fallback for languages without a grammar here.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-elm = "5.9"
tree-sitter-erlang = "0.21"
tree-sitter-fsharp = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-glsl = "0.2"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.24"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.26"
tree-sitter-php = "0.25"
tree-sitter-powershell = "0.26"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-svelte-ng = "1.0"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Build-only: embeds the icon in the Windows executable (rc.exe from the Windows SDK, or windres on GNU targets).
embed-resource = "3"

# Test-only
tempfile = "3"
criterion = "0.7"

[profile.dev.package."*"]
opt-level = 2
